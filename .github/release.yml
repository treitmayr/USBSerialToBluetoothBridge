changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🧰 Maintenance"
      labels:
        - documentation
        - chore
        - refactor
    - title: "Other Changes"
      labels:
        - "*"
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
